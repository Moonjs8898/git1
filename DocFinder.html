<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 문서 탐색기</title>
<script>/* 저장한 밝기를 화면이 그려지기 전에 적용 (깜박임 방지) */try{var t=localStorage.getItem('docfinder.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<!--
  로컬 문서 탐색기 (HTML 파일 하나로 동작)
  - 이 파일만 복사하면 어느 컴퓨터에서든 똑같이 쓸 수 있습니다. 인터넷 연결이나 설치가 필요 없습니다.
  - 크롬 / 엣지: 폴더 목록 저장 + 3초마다 자동 확인
  - 그 외 브라우저: 폴더를 한 번 불러와서 보기·검색 (자동 확인 없음)
  - 읽는 파일: MD, TXT, SQL, HTML, 엑셀(.xlsx), 파워포인트(.pptx), 워드(.docx)
  - 파일은 읽기만 하며 수정·삭제하거나 외부로 보내지 않습니다.
-->
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #e2e5ea; --text: #1c2230; --muted: #6b7280;
  --accent: #2f6fed; --accent-soft: #e8f0fe; --mark: #ffe27a; --mark-text: #1c2230;
  --new: #15803d; --new-soft: #dcfce7; --code: #f1f3f6; --danger: #b91c1c;
  --md: #7c3aed; --txt: #475569; --sql: #0e7490; --html: #ea580c; --folder: #e0a526;
  --xlsx: #16803c; --pptx: #c53030; --docx: #2b5cd6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13151a; --panel: #1b1e25; --line: #2b303a; --text: #e5e7eb; --muted: #9aa3b2;
    --accent: #6d9cff; --accent-soft: #1f2c47; --mark: #8a6d0b; --mark-text: #fff7d6;
    --new: #4ade80; --new-soft: #14341f; --code: #242932; --danger: #f87171;
    --md: #a78bfa; --txt: #94a3b8; --sql: #22b8cf; --html: #fb923c; --folder: #f2c14e;
    --xlsx: #22a35a; --pptx: #e05252; --docx: #4f7ff0;
  }
}
/* 다크 스위치로 직접 고른 경우 (윈도우 설정과 상관없이) */
:root[data-theme="dark"] {
    --bg: #13151a; --panel: #1b1e25; --line: #2b303a; --text: #e5e7eb; --muted: #9aa3b2;
    --accent: #6d9cff; --accent-soft: #1f2c47; --mark: #8a6d0b; --mark-text: #fff7d6;
    --new: #4ade80; --new-soft: #14341f; --code: #242932; --danger: #f87171;
    --md: #a78bfa; --txt: #94a3b8; --sql: #22b8cf; --html: #fb923c; --folder: #f2c14e;
    --xlsx: #22a35a; --pptx: #e05252; --docx: #4f7ff0;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.55 "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "Nanum Gothic", sans-serif;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
/* 스크롤바: 배경과 비슷한 색으로 얇고 흐리게, 마우스를 올리면 조금 진하게 */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*:hover { scrollbar-color: var(--muted) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
svg.i { width: 15px; height: 15px; vertical-align: -2px; flex: none; }
svg.folder { color: var(--folder); }
[hidden] { display: none !important; }
header {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative;
}
/* 다크 스위치: 해·달 사이를 동그라미가 움직임 */
.theme {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  width: 52px; height: 28px; padding: 0 7px; border: 0; border-radius: 999px; background: var(--line); color: var(--muted);
  display: flex; align-items: center; justify-content: space-between;
}
.theme svg { width: 13px; height: 13px; }
.theme .knob {
  position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center; transition: left .18s;
}
.theme.on .knob { left: 27px; }
.theme .knob svg + svg, .theme.on .knob svg:first-child { display: none; }   /* 동그라미 안: 밝을 땐 해, 어두울 땐 달 */
.theme.on .knob svg + svg { display: block; }
.theme .sun { visibility: hidden; } .theme.on .sun { visibility: visible; } .theme.on .moon { visibility: hidden; }
.theme:hover { box-shadow: 0 0 0 1px var(--accent); }
@media (max-width: 900px) { .theme { position: static; transform: none; } }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.search { flex: 1; min-width: 220px; max-width: 620px; position: relative; display: block; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--text); font: inherit; outline: none;
}
.search input:focus { border-color: var(--accent); background: var(--panel); }
.qhist {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 4px 0 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 560px;
}
.qhist .hhead { display: flex; align-items: center; padding: 4px 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
.qhist .hhead button { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 400; }
.qhist .hhead button:hover { color: var(--danger); }
.qhist .hitem { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 12px 6px 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qhist .hitem:hover, .qhist .hitem.on { background: var(--accent-soft); color: var(--accent); }
main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 270px; min-width: 230px; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.roots { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; max-height: 30vh; overflow: auto; scrollbar-gutter: stable; }
/* 접는 칸 제목 (등록한 폴더 / 종류) */
.rtitle { display: flex; align-items: center; gap: 4px; border: 0; background: none; text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 2px 4px; border-radius: 6px; }
.rtitle:hover { color: var(--text); background: var(--bg); }
.rtitle .rwarn { font-weight: 400; margin-left: 4px; }
.rtitle .fsum { font-weight: 400; margin-left: 4px; color: var(--accent); }
.roots.folded { padding-bottom: 6px; }
svg.fold { width: 14px; height: 14px; transition: transform .15s; }
svg.fold.shut { transform: rotate(-90deg); }
.root { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; border-radius: 6px; background: var(--bg); font-size: 13px; }
.root .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.root .rcnt { font-size: 11px; color: var(--muted); white-space: nowrap; }
.root .rwarn { font-size: 11px; color: var(--danger); white-space: nowrap; }
.root button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 16px; line-height: 1; }
.root button:hover { color: var(--danger); }
.root button.reload { font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--accent); }
.root button.reload:hover { color: var(--accent); border-color: var(--accent); }
.root.off .rname { color: var(--muted); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; padding: 10px 4px; border: 0; background: none; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 700;
}
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab .cnt { font-weight: 400; font-size: 12px; margin-left: 3px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 8px; border-bottom: 1px solid var(--line); }
.filters .rtitle { flex-basis: 100%; }
.filters.folded { padding-bottom: 6px; }
.filters.folded .chip { display: none; }
.chip {
  border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted);
}
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip .ccount { font-size: 11px; opacity: .75; }
.chip.zero:not(.on) { opacity: .45; }
.empty .chip { margin-top: 10px; color: var(--accent); border-color: var(--accent); }
/* 왼쪽 파일 목록 */
.list { flex: 1; overflow: auto; padding: 0 0 12px; scrollbar-gutter: stable; }   /* 스크롤바 자리를 미리 비워 둬서 생겨도 단추·개수가 밀리지 않게 */
.group { display: flex; align-items: center; gap: 6px; padding: 10px 14px 4px; font-size: 12px; color: var(--muted); font-weight: 700; word-break: break-all; }
.group.gtoggle { width: 100%; border: 0; background: none; text-align: left; padding: 8px 14px 4px 8px; }
.group.gtoggle:hover { color: var(--text); }
.group .gname { flex: 1; }
.group .gcnt { font-weight: 400; font-size: 11px; }
/* 목록 위 작은 아이콘 단추 + [제외] 창 */
.gbar {   /* 목록을 내려도 위에 붙어 있게 */
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  display: flex; align-items: center; gap: 2px; padding: 4px 10px;
}
.gbar #exBtn { margin-left: auto; }   /* [제외]는 오른쪽 끝 */
.gbar .vbtn { color: var(--accent); background: var(--accent-soft); }   /* 보기 방식 전환 (폴더별 ↔ 트리) */
.gbar .vbtn:hover { color: var(--accent); }
.gbar .gsep { width: 1px; height: 14px; background: var(--line); margin: 0 4px; }
/* 트리 보기: 폴더 안 폴더를 들여써서 표시, 파일은 한 줄 */
.tdir, .item.titem { position: relative; display: flex; align-items: center; gap: 6px; height: 27px; padding-top: 0; padding-bottom: 0; padding-right: 12px; white-space: nowrap; }
.tdir { width: 100%; border: 0; background: none; text-align: left; font-size: 13px; font-weight: 700; color: var(--text); }
.tdir:hover, .item.titem:hover { background: var(--bg); }
.tdir .tname, .item.titem .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tdir .gcnt { font-weight: 400; font-size: 11px; color: var(--muted); }
.item.titem { font-size: 13px; }
.item.titem .ext { width: 34px; font-size: 9px; line-height: 1.4; flex: none; }
.item.titem .tsp { width: 14px; flex: none; }
.tguide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.gbar button { width: 26px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--muted); border-radius: 6px; }
.gbar button:hover { background: var(--bg); color: var(--text); }
.gbar svg { width: 16px; height: 16px; }
.gbar .xbtn.on { color: var(--danger); }
.xpop {
  position: fixed; z-index: 40; width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 12px 14px; font-size: 12.5px;
}
.xpop h4 { display: flex; align-items: center; margin: 0 0 6px; font-size: 12.5px; }
.xpop .xall { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 1px 8px; font-size: 11px; color: var(--accent); }
.xpop .xall:hover { border-color: var(--accent); }
.xpop label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.xpop input { accent-color: var(--danger); margin: 0; }
.xpop .xnote { font-size: 11px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.6; }
.item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center;
  width: 100%; text-align: left; border: 0; background: none; padding: 7px 14px; border-left: 3px solid transparent;
}
.item:hover { background: var(--bg); }
.item.on { background: var(--accent-soft); border-left-color: var(--accent); }
.item:focus { outline: none; }
.item:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { grid-column: 2 / 4; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .snip { grid-column: 1 / 4; font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-all; }
.ext {   /* 종류 배지: 글자 수와 상관없이 같은 크기 */
  display: inline-block; width: 40px; padding: 1px 0; text-align: center; line-height: 1.5;
  font-size: 10px; font-weight: 700; border-radius: 4px; color: #fff; letter-spacing: .3px; font-family: Arial, sans-serif; opacity: .85;
}
.ext.md { background: var(--md); } .ext.txt { background: var(--txt); } .ext.sql { background: var(--sql); } .ext.html { background: var(--html); }
.ext.xlsx { background: var(--xlsx); } .ext.pptx { background: var(--pptx); } .ext.docx { background: var(--docx); }
.lock { display: inline-flex; vertical-align: -2px; margin-right: 4px; color: var(--danger); }   /* 문서보안(DRM)=빨강, 열기 암호=노랑 */
.lock svg { width: 13px; height: 13px; }
.lock.password { color: var(--folder); }
.lock.big { margin: 0 auto 6px; }
.lock.big svg { width: 44px; height: 44px; }
.badge { font-size: 10px; font-weight: 700; color: var(--new); background: var(--new-soft); border-radius: 4px; padding: 1px 6px; font-family: Arial, sans-serif; }
.hits { font-size: 11px; color: var(--accent); white-space: nowrap; }
.empty { padding: 30px 20px; color: var(--muted); text-align: center; line-height: 1.8; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 2px; padding: 0 1px; }
mark.cur { outline: 2px solid var(--accent); }
section.viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* 문서 화면: 가운데 종이 한 장처럼 */
.vhead { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 18px 0; flex-wrap: wrap; }
.vhead .vtitle { font-weight: 700; font-size: 15px; word-break: break-all; }
.vhead .info { color: var(--muted); font-size: 12px; }
.vhead .crumb { font-size: 12px; color: var(--accent); word-break: break-all; }
.vbody { flex: 1; overflow: auto; padding: 16px 24px 60px; outline: none; }
.vbody > .md, .vbody > pre.plain, .vbody > .office {
  max-width: 780px; margin: 0 auto; background: var(--panel); padding: 44px 56px;
  border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.18);
}
.vbody > .office { max-width: 1000px; }
.vbody pre.plain { white-space: pre-wrap; word-break: break-word; margin: 0; font: 13.5px/1.65 Consolas, "D2Coding", "Malgun Gothic", monospace; }
.vbody iframe { width: 100%; height: 100%; min-height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.vbody .md { font-size: 15.5px; line-height: 1.95; }   /* 파일 종류 배지(.ext.md)와 구분 */
.md h1 { font-size: 1.7em; margin-top: 0; } .md h2 { font-size: 1.45em; } .md h3 { font-size: 1.2em; }
.md code { background: var(--code); padding: .1em .35em; border-radius: 4px; font-family: Consolas, "D2Coding", monospace; font-size: .92em; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0; padding: 2px 14px; border-left: 4px solid var(--line); color: var(--muted); }
.md table { border-collapse: collapse; margin: 10px 0; display: block; overflow: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 12px; }
.md th { background: var(--bg); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md .img { color: var(--muted); font-size: 12px; border: 1px dashed var(--line); padding: 1px 6px; border-radius: 4px; }
.md li > input { margin-right: 6px; }
.office .otitle { font-weight: 700; font-size: 15px; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.office .otitle:first-child, .office .slide .otitle { margin-top: 0; }
.office p { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
.office h1, .office h2, .office h3, .office h4, .office h5, .office h6 { margin: 18px 0 8px; }
.office .grid { overflow: auto; max-width: 100%; }
.office table { border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
.office th, .office td { border: 1px solid var(--line); padding: 3px 8px; white-space: pre-wrap; vertical-align: top; max-width: 360px; word-break: break-word; }
.office th { background: var(--bg); color: var(--muted); font-weight: 400; font-size: 12px; }
.office .slide { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; background: var(--panel); }
.office .onote { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.office .omuted, .welcome .omuted { color: var(--muted); font-size: 12px; }
footer {
  display: flex; gap: 14px; padding: 5px 16px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center;
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; }
.live .dot { background: var(--new); }
.paused .dot { background: var(--danger); }
#liveState.live, #liveState.paused { cursor: pointer; }
#liveState.live:hover, #liveState.paused:hover { color: var(--text); }
.toast {
  position: fixed; right: 18px; bottom: 40px; background: var(--text); color: var(--panel);
  padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; max-width: 360px;
}
.toast.show { opacity: 1; transform: none; }
.notice {
  position: fixed; left: 16px; top: 58px; z-index: 20; width: 420px; max-width: calc(100vw - 32px);
  background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 13px; line-height: 1.7;
}
.notice p { margin: 6px 0; }
.notice ul { margin: 4px 0 10px; padding-left: 18px; color: var(--muted); }
.notice .nbtns { display: flex; gap: 8px; justify-content: flex-end; }
.welcome { max-width: 580px; margin: 8vh auto; text-align: center; color: var(--muted); line-height: 1.9; }
.welcome h2 { color: var(--text); }
.lockview { line-height: 1.8; }
.warn { color: var(--danger); }
@media (max-width: 760px) {
  main { flex-direction: column; }
  aside { width: 100%; height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .vbody { padding: 12px; }
  .vbody > .md, .vbody > pre.plain, .vbody > .office { padding: 20px 18px; }
}
</style>
</head>
<body>
<header>
  <button class="btn primary" id="pickBtn" title="폴더를 등록하고 3초마다 자동 확인">+ 폴더 추가</button>
  <button class="btn" id="reconnectBtn" hidden>다시 연결</button>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
  <label class="search">

function drawParas(node) {   // 도형 속 문단들
  var out = [];
  els(node, 'p').forEach(function (p) {

}
function isOn(v) { return v === '1' || v === 'true'; }

var W_SKIP = { pPr: 1, rPr: 1, txbxContent: 1 };

  els(styles, 'style').forEach(function (s) {

    if (m) heads[attr(s, 'styleId')] = Math.min(+m[1], 6); else if (v === 'title') heads[attr(s, 'styleId')] = 1;

    kids(node).forEach(function (c) {

      if (n === 'p') {

// 바이트 안에 UTF-16 글자가 있는지 찾기 (오피스 열기 암호 파일 구분용)

    if (b[p] !== pat[0]) continue;

}
async function readOffice(buf, ext) {
  if (!CAN_OFFICE) throw new Error('old');

  // 정상 파일은 ZIP(PK)로 시작. 오피스 열기 암호 파일은 옛 오피스 형식(D0 CF 11 E0) 안에 EncryptedPackage가 들어 있음
  if (head.length >= 4 && head[0] === 0xD0 && head[1] === 0xCF && head[2] === 0x11 && head[3] === 0xE0) throw new Error(hasUtf16(head, 'EncryptedPackage') ? 'password' : 'drm');

// ===== 폴더 목록 저장 (이 브라우저 안에 저장, 다음에 열어도 유지) =====

  var cnt = {}; files.forEach(function (f) { cnt[f.rootId] = (cnt[f.rootId] || 0) + 1; });

// 크롬은 다운로드·사용자 폴더·윈도우 폴더 같은 곳을 "시스템 파일 포함"이라며 통째로는 막음 (그 안의 하위 폴더는 가능)

// ===== 제외할 종류 (DRM 등으로 어차피 못 읽는 종류를 목록에서 빼기, 이 브라우저에 저장) =====
var excluded = {};
try { JSON.parse(localStorage.getItem(STORE_KEY.excluded) || '[]').forEach(function (e) { if (EXT_LABEL[e]) excluded[e] = 1; }); } catch (e) {}
// 읽을 문서 종류인지 (제외한 종류, ~$로 시작하는 오피스 임시 파일은 빼고)
function docExt(name) {
  var ext = EXT_GROUP[(name.split('.').pop() || '').toLowerCase()];
  return ext && name.indexOf('.') > 0 && name.indexOf('~$') !== 0 && !excluded[ext] ? ext : null;
}
// 건너뛸 폴더인지 (.git, node_modules 같은 개발 폴더와 점(.)으로 시작하는 숨김 폴더)
function skipDir(name) { return SKIP_DIRS[name.toLowerCase()] || name.charAt(0) === '.'; }
// exts: 종류 하나('pptx') 또는 여러 개(['md','txt']) - [All]/[None]은 한 번에 처리
function setExcluded(exts, on) {
  exts = [].concat(exts);
  exts.forEach(function (x) { if (on) excluded[x] = 1; else delete excluded[x]; });
  try { localStorage.setItem(STORE_KEY.excluded, JSON.stringify(Object.keys(excluded))); } catch (e) {}
  if (on) {
    files.forEach(function (f, k) { if (exts.indexOf(f.ext) >= 0) { files.delete(k); if (k === current) { closeCurrent(); showWelcome(); } } });
    if (exts.indexOf(extFilter) >= 0) extFilter = '';
  } else {
    // 다시 포함: 한 번 불러온 폴더는 가진 파일 목록에서, 실시간 폴더는 처음 읽기처럼(NEW 표시 없이) 다시 확인
    roots.forEach(function (r) {
      if (r.isStatic) indexStatic(r, false, true).then(function () { renderRoots(); render(); });
      else if (r.ok) r.scanned = false;
    });
    kick();
  }
  applyExcludedUI(); renderRoots(); render();
}
function applyExcludedUI() {   // 제외한 종류의 단추는 숨김
  document.querySelectorAll('.chip[data-ext]').forEach(function (c) {

    c.hidden = !!(k && excluded[k]);
    c.classList.toggle('on', k === extFilter);
  });
}
function toggleExPop(force) {

// 제외 창을 아이콘 바로 아래(오른쪽 끝 맞춤)에 붙임 - 종류 단추가 숨거나 다시 나와 아이콘 위치가 바뀌어도 따라감
function placeExPop() {
  var pop = $('exPop'), btn = $('exBtn');
  if (pop.hidden) return;
  if (!btn) { pop.hidden = true; return; }   // 전체 탭이 아니면 닫기

// ===== 폴더 확인 (주기적으로 반복) =====
async function walk(dir, prefix, out) {
  for await (var entry of dir.entries()) {
    var name = nfc(entry[0]), h = entry[1];
    if (h.kind === 'directory') {
      if (!skipDir(name)) await walk(h, prefix + name + '/', out);
    } else {
      var ext = docExt(name);
      if (ext) out.push({ path: prefix + name, name: name, ext: ext, handle: h });
    }
  }
}

async function addFileInfo(r, path, name, ext, file, handle, isNew) {
  var key = r.id + '/' + path;
  var old = files.get(key);
  var text = null, searchText = '', officeHtml = null, readError = '', lock = '';
  if (file.size <= (OFFICE[ext] ? MAX_OFFICE : MAX_READ)) {
    try {
      if (OFFICE[ext]) {
        var o = await readOffice(await file.arrayBuffer(), ext);
        text = searchText = nfc(o.text); officeHtml = nfc(o.html);
      } else {
        text = nfc(decode(await file.arrayBuffer()));
        searchText = ext === 'html' ? htmlToText(text) : text;
      }
    } catch (e) {
      text = null; searchText = ''; readError = OFFICE[ext] ? officeError(e) : '파일 내용을 읽지 못했습니다.';
      var em = e && e.message;
      if (OFFICE[ext]) lock = em === 'password' || em === 'locked' ? 'password' : em === 'drm' || em === 'notzip' ? 'drm' : '';
    }
  } else readError = '파일이 너무 커서(' + fmtSize(file.size) + ') 미리보기를 생략했습니다.';
  var info = {
    key: key, rootId: r.id, path: path, name: name, ext: ext, handle: handle,
    folder: r.name + (path.indexOf('/') >= 0 ? '/' + path.slice(0, path.lastIndexOf('/')) : ''),
    lastModified: file.lastModified, size: file.size, text: text, searchText: searchText, officeHtml: officeHtml, readError: readError, lock: lock,
    lower: (name + '\n' + searchText).toLowerCase(),
    isNew: old ? old.isNew : isNew, foundAt: old ? old.foundAt : Date.now()
  };
  files.set(key, info);
  return { info: info, wasOld: !!old };
}

async function scan() {
  var added = [], changed = [], removed = [], firstLoad = false;
  var list = roots.slice();   // 읽는 도중 폴더를 빼도 안전하게 복사본으로 돌기
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    if (!r.ok || r.isStatic || roots.indexOf(r) < 0) continue;
    var part = [];
    try { await walk(r.handle, '', part); }
    catch (e) {
      r.ok = false;
      r.error = e.name === 'NotFoundError' ? '폴더 없음' : '연결 필요';
      continue;
    }
    var seen = {};
    for (var j = 0; j < part.length; j++) {
      var f = part[j], key = r.id + '/' + f.path;
      if (excluded[f.ext]) continue;   // 확인 도중에 제외한 종류
      seen[key] = 1;
      var file;
      try { file = await f.handle.getFile(); } catch (e) { continue; }
      var old = files.get(key);
      if (old && old.lastModified === file.lastModified && old.size === file.size) continue;
      // 새로 등록한 폴더의 첫 확인에서는 NEW 표시 안 함
      var res = await addFileInfo(r, f.path, f.name, f.ext, file, f.handle, r.scanned);
      if (res.wasOld) changed.push(res.info); else if (res.info.isNew) added.push(res.info);
    }
    if (roots.indexOf(r) < 0) continue;   // 읽는 도중에 목록에서 뺀 폴더
    files.forEach(function (info, k) { if (info.rootId === r.id && !seen[k]) { removed.push(k); files.delete(k); } });
    if (!r.scanned) { r.scanned = true; firstLoad = true; }
  }
  dropOrphans();
  return { added: added, changed: changed, removed: removed, firstLoad: firstLoad };
}

// 아래 상태 표시줄의 점을 누르면 실시간 확인 멈춤 / 다시 시작 (이 창을 연 동안만)
var paused = false;
function togglePause() {
  paused = !paused;
  clearTimeout(timer);
  if (paused) setLive('paused', '실시간 확인 멈춤 (점을 누르면 다시 시작)');
  else kick();
}
async function loop() {
  if (scanning) return;
  var live = roots.filter(function (r) { return r.ok && !r.isStatic; });
  if (!live.length) {
    setLive(false, roots.length ? (roots.some(function (r) { return r.isStatic; }) ? '한 번 불러온 폴더 (새 파일은 [새로 고침])' : '연결된 폴더 없음') : '폴더 없음');
    return;
  }
  // 멈춤 중이어도 새로 추가한 폴더는 한 번은 읽음
  if (paused && live.every(function (r) { return r.scanned; })) { setLive('paused', '실시간 확인 멈춤 (점을 누르면 다시 시작)'); return; }
  scanning = true;
  var t0 = performance.now();
  try {
    var before = roots.map(function (x) { return x.ok; }).join();
    var r = await scan();
    var wasFirst = !firstScanDone;
    firstScanDone = true;
    var staticN = roots.filter(function (x) { return x.isStatic; }).length;
    setLive(paused ? 'paused' : true,(paused ? '실시간 확인 멈춤 (점을 누르면 다시 시작)' : '실시간 확인 중 (폴더 ' + live.length + '개)') + (staticN ? ' · 한 번 불러온 폴더 ' + staticN + '개' : ''));
    if (wasFirst && !current) showWelcome();
    if (r.added.length) toast('새 파일 ' + r.added.length + '개: ' + r.added.map(function (f) { return f.name; }).slice(0, 3).join(', '));
    if (current && r.removed.indexOf(current) >= 0) closeCurrent('열려 있던 파일이 삭제되었습니다.');
    else if (current && r.changed.some(function (f) { return f.key === current; })) openFile(current, true);
    if (wasFirst || r.firstLoad || r.added.length || r.changed.length || r.removed.length || before !== roots.map(function (x) { return x.ok; }).join()) { renderRoots(); render(); }
  } catch (e) {
    setLive(false, '확인 중 오류');
  }
  var took = performance.now() - t0;
  $('lastScan').textContent = '마지막 확인 ' + fmtClock(new Date()) + ' (' + Math.round(took) + 'ms)';
  scanning = false;
  if (!paused) timer = setTimeout(loop, Math.max(MIN_INTERVAL, took * 3));
}
// state: true = 확인 중(초록), 'paused' = 멈춤(빨강), false = 확인할 폴더 없음(회색)
function setLive(state, text) {
  var el = $('liveState');
  el.className = state === 'paused' ? 'paused' : state ? 'live' : '';
  el.title = state === 'paused' ? '누르면 실시간 확인을 다시 시작합니다' : state ? '누르면 실시간 확인을 멈춥니다' : '';
  el.innerHTML = '<span class="dot"></span>' + esc(text);
}

// ===== 목록 그리기 =====
function filtered(allTypes) {
  var arr = [];
  files.forEach(function (f) { if (allTypes || !extFilter || f.ext === extFilter) arr.push(f); });
  return arr;
}
// 종류 단추에 개수 표시 (검색 중이면 검색 결과 개수), 0개인 종류는 흐리게
function updateChips(allResults) {
  var counts = {}, total = 0;
  if (allResults) allResults.forEach(function (r) { counts[r.f.ext] = (counts[r.f.ext] || 0) + 1; total++; });
  else files.forEach(function (f) { counts[f.ext] = (counts[f.ext] || 0) + 1; total++; });
  document.querySelectorAll('.chip[data-ext]').forEach(function (c) {
    var k = c.dataset.ext, n = k ? (counts[k] || 0) : total;
    c.innerHTML = esc(k ? EXT_LABEL[k] : '전체') + ' <span class="ccount">' + n + '</span>';
    c.classList.toggle('zero', !n && !!k);
  });
}
function noTypeHtml(msg, otherCount) {
  return '<div class="empty">' + msg + (otherCount ? '<br><button class="chip" data-reset-filter>전체 종류 보기 (' + otherCount + '개)</button>' : '') + '</div>';
}

function lockIcon(kind) {
  return '<span class="lock ' + kind + '" title="' + (kind === 'password' ? '열기 암호가 걸린 파일' : '문서보안(DRM) 파일 - 내용은 읽을 수 없음') + '">' + LOCK_SVG + '</span>';
}
function itemHtml(f, extra) {
  extra = extra || {};
  return '<button class="item' + (f.key === current ? ' on' : '') + '" data-key="' + esc(f.key) + '">' +
    '<span class="ext ' + f.ext + '">' + f.ext.toUpperCase() + '</span>' +
    '<span class="name" title="' + esc(f.folder + '/' + f.name) + '">' + (f.lock ? lockIcon(f.lock) : '') + esc(f.name) + '</span>' +
    (extra.hits ? '<span class="hits">' + extra.hits + '건</span>' : (f.isNew ? '<span class="badge">NEW</span>' : '<span></span>')) +
    '<span class="meta">' + (extra.showFolder ? esc(f.folder) + ' · ' : '') + fmtTime(f.lastModified) + ' · ' + fmtSize(f.size) + '</span>' +
    (extra.snip ? '<span class="snip">' + extra.snip + '</span>' : '') +
    '</button>';
}

function markHtml(raw, re) {
  if (!re) return esc(raw);
  var out = '', last = 0, m; re.lastIndex = 0;
  while ((m = re.exec(raw))) {
    if (!m[0].length) { re.lastIndex++; continue; }
    out += esc(raw.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(raw.slice(last));
}

function searchResults(allTypes) {
  var t = terms().map(function (s) { return s.toLowerCase(); }); if (!t.length) return [];
  var re = termRegex(), res = [];
  filtered(allTypes).forEach(function (f) {
    if (!t.every(function (w) { return f.lower.indexOf(w) >= 0; })) return;
    var body = f.searchText || '';
    re.lastIndex = 0;
    var hits = 0, first = -1, m;
    while ((m = re.exec(body)) && hits < 999) { if (first < 0) first = m.index; hits++; }
    var snip;
    if (first >= 0) {
      var s = Math.max(0, first - 40), e = Math.min(body.length, first + 90);
      snip = (s > 0 ? '...' : '') + markHtml(body.slice(s, e).replace(/\s+/g, ' '), re) + (e < body.length ? '...' : '');
    } else snip = '파일 이름에서 찾음';
    var nameHit = t.some(function (w) { return f.name.toLowerCase().indexOf(w) >= 0; }) ? 1000 : 0;
    res.push({ f: f, hits: hits, snip: snip, score: nameHit + hits });
  });
  return res.sort(function (a, b) { return b.score - a.score || b.f.lastModified - a.f.lastModified; });
}

// 전체 탭 보기 방식: 'group'(폴더별, 기본) / 'tree'(트리) - 고른 방식은 저장
var listView = 'group';
try { if (localStorage.getItem(STORE_KEY.listView) === 'tree') listView = 'tree'; } catch (e) {}
function setListView(v) {
  listView = v;
  try { localStorage.setItem(STORE_KEY.listView, v); } catch (e) {}
  render();
}
// 접은 폴더 (이 창을 연 동안만 기억) - 폴더별 묶음과 트리 폴더를 따로 기억
var foldedGroups = {}, foldedTree = {};
function groupKey(f) { return f.rootId + '/' + f.folder; }   // 이름이 같은 폴더를 두 개 등록해도 따로 묶이게
function subDir(f) { return f.path.indexOf('/') >= 0 ? f.path.slice(0, f.path.lastIndexOf('/')) : ''; }
function treeKey(rootId, dir) { return rootId + '|' + dir; }
// 파일이 들어 있는 트리 폴더들 (등록 폴더부터 바로 위 폴더까지)
function treeAncestors(f) {
  var segs = subDir(f) ? subDir(f).split('/') : [], keys = [treeKey(f.rootId, '')];
  for (var i = 1; i <= segs.length; i++) keys.push(treeKey(f.rootId, segs.slice(0, i).join('/')));
  return keys;
}
// 접힌 폴더 안의 파일을 열면(검색·링크·최근 등) 지금 보기 방식에서 그 폴더를 펼침. 펼친 게 있으면 true
function revealFile(f) {
  var changed = false;
  if (listView === 'tree') treeAncestors(f).forEach(function (k) { if (foldedTree[k]) { delete foldedTree[k]; changed = true; } });
  else if (foldedGroups[groupKey(f)]) { delete foldedGroups[groupKey(f)]; changed = true; }
  return changed;
}
// 트리 목록 html: 등록 폴더마다 하위 폴더를 먼저, 그다음 파일 (이름순)
function treeHtml(list) {
  var trees = {};
  list.forEach(function (f) {
    var t = trees[f.rootId] || (trees[f.rootId] = { dirs: {}, files: [], count: 0 });
    t.count++;
    var d = subDir(f);
    (d ? d.split('/') : []).forEach(function (s) {
      t = t.dirs[s] || (t.dirs[s] = { dirs: {}, files: [], count: 0 });
      t.count++;
    });
    t.files.push(f);
  });
  var guides = function (depth) { var g = ''; for (var i = 0; i < depth; i++) g += '<span class="tguide" style="left:' + (16 + i * 16) + 'px"></span>'; return g; };
  var pad = function (depth) { return ' style="padding-left:' + (8 + depth * 16) + 'px"'; };
  var out = '';

  if (f.ext === 'html' && viewMode === 'rendered') {
    var fr = document.createElement('iframe');
    // 원본 스크립트는 지우고, 링크 누름을 알려 주는 우리 스크립트 하나만 실행 허용 (부모 화면·저장소 접근 불가)
    fr.setAttribute('sandbox', 'allow-scripts');
    fr.setAttribute('referrerpolicy', 'no-referrer');
    body.appendChild(fr);
    var token = ++htmlToken;
    buildHtmlDoc(f).then(function (html) { if (token === htmlToken) fr.srcdoc = html; })
      .catch(function () { if (token === htmlToken) fr.srcdoc = '<meta charset="utf-8"><p>화면을 만들지 못했습니다. [원문 보기]로 확인해 주세요.</p>'; });
    setHits(query.trim() ? -1 : 0);
    return;
  }
  var el;
  if (OFFICE[f.ext]) { el = document.createElement('div'); el.className = 'office'; el.innerHTML = f.officeHtml; }   // 글자는 모두 esc 처리됨
  else if (f.ext === 'md' && viewMode === 'rendered') { el = document.createElement('div'); el.className = 'md'; el.innerHTML = renderMarkdown(f.text); }
  else { el = document.createElement('pre'); el.className = 'plain'; el.textContent = f.text; }
  // 엑셀이 길어서 화면에 일부 줄만 보일 때: 검색어가 들어 있는 줄을 위에 따로 모아 보여 줌
  if (f.ext === 'xlsx' && query.trim() && f.officeHtml.indexOf('줄만 보여 줍니다') >= 0) {
    var tl = terms().map(function (s) { return s.toLowerCase(); }), found = [], sheet = '', lines = f.searchText.split('\n');
    for (var li = 0; li < lines.length && found.length < 300; li++) {
      if (lines[li].indexOf('[시트] ') === 0) { sheet = lines[li].slice(5); continue; }
      var low = lines[li].toLowerCase();
      if (tl.some(function (w) { return low.indexOf(w) >= 0; })) found.push('<tr><th>' + esc(sheet) + '</th><td>' + esc(lines[li].replace(/\t/g, '  |  ')) + '</td></tr>');
    }
    if (found.length) {
      var box = document.createElement('div');
      box.innerHTML = '<div class="otitle">검색어가 있는 줄 ' + found.length + (found.length >= 300 ? '+' : '') + '개 (표에 안 보이는 줄 포함)</div><div class="grid"><table>' + found.join('') + '</table></div>';
      el.insertBefore(box, el.firstChild);
    }
  }
  body.appendChild(el);
  var n = highlight(el);
  setHits(n);
  if (keepScroll) body.scrollTop = scroll;
  else if (n) { hitIndex = -1; goHit(1); }
}

function setHits(n) {
  hitIndex = 0;
  $('vHits').textContent = n > 0 ? n + '곳 찾음' : (n < 0 ? 'HTML 화면에서는 강조 안 됨 · [원문 보기]에서 확인' : '');
  $('prevHit').hidden = $('nextHit').hidden = !(n > 1);
}
function goHit(delta) {
  var marks = $('vbody').querySelectorAll('mark'); if (!marks.length) return;
  marks.forEach(function (m) { m.classList.remove('cur'); });
  hitIndex = (hitIndex + delta + marks.length) % marks.length;
  var m = marks[hitIndex]; m.classList.add('cur');
  m.scrollIntoView({ block: 'center' });
  $('vHits').textContent = (hitIndex + 1) + ' / ' + marks.length + '곳';
}

// ===== 이벤트 =====
$('pickBtn').onclick = addFolder;
$('backBtn').onclick = goBack;
$('helpOnce').onclick = function () { hideBlockHelp(); pickOnce(); };
$('helpClose').onclick = hideBlockHelp;
$('reconnectBtn').onclick = reconnect;
$('liveState').onclick = function () { if (this.className) togglePause(); };   // 확인할 폴더가 있을 때만

// ===== 다크 스위치 (고른 밝기는 저장, 한 번도 고르지 않았으면 윈도우 설정을 따라감) =====
var ICON_SUN = LINE_SVG + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var ICON_MOON = LINE_SVG + '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
var sysDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function isDark() {
  var t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : !!(sysDark && sysDark.matches);
}
function renderTheme() {
  var b = $('themeBtn'), dark = isDark();
  b.classList.toggle('on', dark);
  b.title = dark ? '밝게 보기' : '어둡게 보기';
  b.setAttribute('aria-label', b.title);
}
$('themeBtn').innerHTML = '<span class="sun">' + ICON_SUN + '</span><span class="moon">' + ICON_MOON + '</span><span class="knob">' + ICON_SUN + ICON_MOON + '</span>';
$('themeBtn').onclick = function () {
  var t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(STORE_KEY.theme, t); } catch (e) {}
  renderTheme();
};
if (sysDark) {
  var onSys = function () { renderTheme(); };   // 윈도우 설정이 바뀌면 스위치 모양도 맞춤
  if (sysDark.addEventListener) sysDark.addEventListener('change', onSys); else if (sysDark.addListener) sysDark.addListener(onSys);
}
renderTheme();
$('dirInput').addEventListener('change', function () { loadStaticFolder(this.files); });
document.addEventListener('click', function (e) {
  var rm = e.target.closest('[data-remove]'); if (rm) { removeFolder(rm.dataset.remove); return; }
  var rl = e.target.closest('[data-reload]'); if (rl) { pickOnce(rl.dataset.reload); return; }
  if (e.target.closest('#rootsToggle')) { toggleRoots(); return; }
  if (e.target.closest('#filtersToggle')) { toggleFilters(); return; }
  if (e.target.closest('#exBtn')) { toggleExPop(); return; }
  if (!$('exPop').hidden && !e.target.closest('#exPop')) toggleExPop(false);   // 바깥을 누르면 닫기
  if (e.target.closest('[data-reset-filter]')) { setExtFilter(''); return; }
  var gt = e.target.closest('[data-group]'); if (gt) { foldedGroups[gt.dataset.group] = !foldedGroups[gt.dataset.group]; render(); return; }
  var td = e.target.closest('[data-tdir]'); if (td) { foldedTree[td.dataset.tdir] = !foldedTree[td.dataset.tdir]; render(); return; }
  if (e.target.closest('#viewBtn')) { setListView(listView === 'tree' ? 'group' : 'tree'); return; }
  var fa = e.target.closest('[data-fold-all]');
  if (fa) {
    var shutAll = fa.dataset.foldAll === '1';
    if (listView === 'tree') {   // 트리: 등록 폴더는 펼친 채로 두고 그 안의 하위 폴더를 모두 접기
      foldedTree = {};
      if (shutAll) files.forEach(function (f) { treeAncestors(f).slice(1).forEach(function (k) { foldedTree[k] = true; }); });
    } else {
      foldedGroups = {};
      if (shutAll) files.forEach(function (f) { foldedGroups[groupKey(f)] = true; });
    }
    render(); return;
  }
  if (e.target.id === 'clearNew') { e.stopPropagation(); files.forEach(function (f) { f.isNew = false; }); render(); return; }
  var it = e.target.closest('.item'); if (it) { navStack = []; openFile(it.dataset.key); }
});
$('exPop').addEventListener('change', function (e) { var c = e.target.closest('[data-ex]'); if (c) { setExcluded(c.dataset.ex, c.checked); toggleExPop(true); } });
$('exPop').addEventListener('click', function (e) {
  e.stopPropagation();   // 창 안을 누른 것은 '바깥 누르면 닫기'로 넘기지 않음 (내용을 다시 그려도 창이 닫히지 않게)
  var a = e.target.closest('[data-ex-all]'); if (!a) return;
  setExcluded(Object.keys(EXT_LABEL), a.dataset.exAll === '1');   // All = 모두 체크, None = 모두 풀기
  toggleExPop(true);
});
function setTab(t) {
  if (t !== 'all') toggleExPop(false);
  tab = t;
  document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === t); });
}
document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { setTab(t.dataset.tab); render(); }; });
function setExtFilter(ext) {
  extFilter = ext;
  document.querySelectorAll('.chip[data-ext]').forEach(function (x) { x.classList.toggle('on', x.dataset.ext === ext); });
  render();
}
document.querySelectorAll('.chip[data-ext]').forEach(function (c) {
  c.onclick = function () { setExtFilter(c.dataset.ext); };
});
var qTimer;
// ===== 최근 검색어 (이 창을 닫으면 사라짐, 어디에도 저장하지 않음) =====
var qHistory = [], histIndex = -1, HIST_MAX = 10;
function rememberQuery(v) {
  v = nfc(String(v || '')).trim(); if (!v) return;
  qHistory = [v].concat(qHistory.filter(function (x) { return x !== v; })).slice(0, HIST_MAX);
}
function showHistory() {
  var box = $('qHist');
  if ($('q').value.trim() || !qHistory.length) { box.hidden = true; return; }
  histIndex = -1;
  box.innerHTML = '<div class="hhead">최근 검색어<button type="button" id="histClear">모두 지우기</button></div>' +
    qHistory.map(function (h, i) { return '<button type="button" class="hitem" data-hist="' + i + '">' + esc(h) + '</button>'; }).join('');
  box.hidden = false;
}
function hideHistory() { $('qHist').hidden = true; histIndex = -1; }
function pickHistory(i) {
  var v = qHistory[i]; if (v == null) return;
  $('q').value = v; hideHistory(); clearTimeout(qTimer); applySearch(); $('q').focus();
}
function moveHistory(d) {
  var items = $('qHist').querySelectorAll('.hitem'); if (!items.length) return;
  histIndex = (histIndex + d + items.length) % items.length;
  items.forEach(function (b, i) { b.classList.toggle('on', i === histIndex); });
}
$('qHist').addEventListener('mousedown', function (e) { e.preventDefault(); });   // 누르는 동안 검색창 포커스 유지
$('qHist').addEventListener('click', function (e) {
  if (e.target.closest('#histClear')) { qHistory = []; hideHistory(); return; }
  var b = e.target.closest('[data-hist]'); if (b) pickHistory(+b.dataset.hist);
});
$('q').addEventListener('focus', showHistory);
$('q').addEventListener('blur', function () { rememberQuery($('q').value); hideHistory(); });

var lastApplied = '';
function applySearch() {
  query = $('q').value;
  if (!query.trim() && lastApplied.trim()) rememberQuery(lastApplied);   // 검색어를 지우면 직전 검색어를 기억
  lastApplied = query;
  if (document.activeElement === $('q')) showHistory();
  if (query.trim() && tab !== 'search') setTab('search');
  render();
  if (current) {
    var cf = files.get(current);
    // HTML 화면은 검색어 강조를 하지 않으므로 다시 만들지 않고 안내만 바꿈 (입력할 때마다 화면을 새로 만드는 낭비 방지)
    if (cf && cf.ext === 'html' && viewMode === 'rendered' && cf.text != null && $('vbody').querySelector('iframe')) setHits(query.trim() ? -1 : 0);
    else openFile(current);
  }
}
$('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(applySearch, 250); });
$('q').addEventListener('compositionend', function () { clearTimeout(qTimer); qTimer = setTimeout(applySearch, 150); });
$('q').addEventListener('keydown', function (e) {
  if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중 엔터는 무시 (두 번 실행 방지)
  var histOpen = !$('qHist').hidden;
  if (histOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); moveHistory(e.key === 'ArrowDown' ? 1 : -1); return; }
  if (histOpen && e.key === 'Enter' && histIndex >= 0) { e.preventDefault(); pickHistory(histIndex); return; }
  // 검색어가 있을 때 ↓ / ↑ : 검색창에서 바로 결과 목록으로 넘어가 파일 이동
  if (!histOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && $('q').value.trim()) {
    e.preventDefault(); e.stopPropagation(); rememberQuery($('q').value); moveFile(e.key === 'ArrowDown' ? 1 : -1); return;
  }
  if (e.key === 'Enter') { clearTimeout(qTimer); applySearch(); rememberQuery($('q').value); var first = listItems()[0]; if (first) { navStack = []; openFile(first.dataset.key); } }
  if (e.key === 'Escape') { if (histOpen) { hideHistory(); return; } $('q').value = ''; applySearch(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); $('q').select(); }
  if (e.key === 'F3') { e.preventDefault(); goHit(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape' && !$('exPop').hidden) toggleExPop(false);
  if (e.altKey && e.key === 'ArrowLeft' && navStack.length) { e.preventDefault(); goBack(); }
  // 파일 목록에서 ↓ / ↑ : 다음 / 이전 파일 열기 (문서 화면을 눌러 둔 상태에서는 원래대로 화면 스크롤)
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey) {
    var a = document.activeElement;
    if (a === document.body || a === document.documentElement || (a && a.closest && a.closest('#list'))) {
      e.preventDefault(); moveFile(e.key === 'ArrowDown' ? 1 : -1);
    }
  }
});
function listItems() { return Array.from(document.querySelectorAll('#list .item')); }
function moveFile(d) {
  var items = listItems(); if (!items.length) return;
  var i = items.findIndex(function (b) { return b.dataset.key === current; });
  var n = i < 0 ? (d > 0 ? 0 : items.length - 1) : Math.min(items.length - 1, Math.max(0, i + d));
  if (n === i) return;
  var key = items[n].dataset.key;
  navStack = []; openFile(key);
  // 목록이 다시 그려졌을 수 있으므로 새로 찾아서 포커스 (계속 방향키로 이동 가능)
  var b = listItems().find(function (x) { return x.dataset.key === key; });
  if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest' }); }
}
$('prevHit').onclick = function () { goHit(-1); };
$('nextHit').onclick = function () { goHit(1); };
$('modeBtn').onclick = function () { viewMode = viewMode === 'rendered' ? 'source' : 'rendered'; openFile(current); };
setInterval(function () { if (files.size && tab !== 'search') render(); }, 60000);   // "몇 분 전" 표시 갱신

// ===== 시작 =====
(async function init() {
  if (!CAN_WATCH) $('pickBtn').textContent = '+ 폴더 불러오기';
  applyExcludedUI();
  var saved = CAN_WATCH ? await loadRoots() : [];
  for (var i = 0; i < saved.length; i++) {
    var s = saved[i];
    if (!s || !s.handle) continue;
    var ok = false;
    try { ok = await s.handle.queryPermission({ mode: 'read' }) === 'granted'; } catch (e) {}
    roots.push({ id: s.id, name: nfc(s.handle.name), handle: s.handle, ok: ok, scanned: false });
  }
  showWelcome();
  renderRoots(); render();
  loop();
})();
</script>
