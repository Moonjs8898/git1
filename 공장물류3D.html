<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공장 물류 3D 현황</title>
<style>
:root{--bg:#0d1420;--panel:#121c2b;--panel2:#0f1826;--line:#24344b;--txt:#dfe8f5;--mut:#8ea3bf;--acc:#3fb6ff;--hl:#ffb020;--mv:#22d3ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap}
.search{position:relative;flex:0 1 330px;min-width:190px}
.search input{width:100%;background:#0a111c;border:1.5px solid var(--acc);border-radius:8px;padding:7px 30px 7px 11px;color:var(--txt);font:inherit;font-size:14px;outline:none}
.search .x{position:absolute;right:6px;top:5px;border:0;background:none;color:var(--mut);font-size:16px;padding:2px 6px;display:none}
.sres{position:absolute;top:40px;left:0;right:0;background:#16233a;border:1px solid var(--line);border-radius:8px;z-index:30;max-height:60vh;overflow:auto;display:none;box-shadow:0 10px 30px #000a}
.sres div{padding:7px 11px;cursor:pointer;border-bottom:1px solid #ffffff0d}
.sres div:hover,.sres div.on{background:#24344b}
.sres small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);margin-left:auto;white-space:nowrap}
.live i{width:9px;height:9px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97;animation:blink 1.2s infinite}
button{background:#16233a;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button:hover{border-color:var(--acc)}
.pop{position:relative}
.menu{position:absolute;right:0;top:36px;background:#16233a;border:1px solid var(--line);border-radius:8px;padding:6px;display:none;z-index:30;min-width:220px;box-shadow:0 10px 30px #000a}
.menu button{display:block;width:100%;text-align:left;margin:3px 0}
.menu p{margin:4px 6px 6px;color:var(--mut);font-size:11.5px;line-height:1.5}
#crumb{display:flex;align-items:center;gap:4px;padding:7px 14px;color:var(--mut);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:36px}
#crumb a{color:var(--txt);cursor:pointer;padding:2px 7px;border-radius:5px}
#crumb a:hover{background:#24344b}
#crumb a.cur{color:var(--hl);font-weight:700}
#crumb .up{margin-left:auto}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#14233c,#0b111b 72%)}
#sv{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
#sv.drag{cursor:grabbing}
#sv text{pointer-events:none}
[data-nav]{cursor:pointer}
.hov{filter:brightness(1.45) saturate(1.2)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px}
.zoom button{width:34px;height:34px;padding:0;font-size:16px}
#hint{position:absolute;left:12px;bottom:12px;color:var(--mut);font-size:12px;background:#0b1422cc;border:1px solid var(--line);border-radius:7px;padding:6px 9px;pointer-events:none}
#legend{position:absolute;left:12px;top:12px;font-size:12px;background:#0b1422dd;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.9;pointer-events:none}
#legend b{font-weight:400;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:#0b1422f2;border:1px solid var(--acc);border-radius:7px;padding:6px 9px;font-size:12px;display:none;z-index:40;max-width:320px;white-space:pre-line}
#side{width:370px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
#side h3{font-size:13px;color:var(--mut);font-weight:400;margin:16px 0 8px}
#side h3:first-child{margin-top:0}
.title{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sum div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.sum b{display:block;font-size:17px}
.sum span{color:var(--mut);font-size:11.5px}
.sum .all{grid-column:1/3}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.li:hover{border-color:var(--acc)}
.li.on{border-color:var(--hl)}
.li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .c{color:var(--mut);font-size:12px;white-space:nowrap}
.li.gray{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#16233a;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.st{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:400}
tr.hit td{background:#3a2c08;color:#ffe2a8}
tr.click{cursor:pointer}
tr.click:hover td{background:#1a2840}
.filter{width:100%;background:#0a111c;border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--txt);font:inherit;margin-bottom:6px}
.more{color:var(--mut);font-size:12px;padding:6px 2px}
.empty{color:var(--mut);padding:30px 10px;text-align:center;line-height:1.8}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16233a;border:1px solid var(--acc);border-radius:8px;padding:9px 14px;display:none;z-index:50;max-width:80vw}
#drop{position:fixed;inset:0;background:#0d1420dd;border:3px dashed var(--acc);display:none;align-items:center;justify-content:center;font-size:20px;z-index:60}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 2.4s ease-in-out infinite}
.blinkf{animation:blink .8s steps(2) infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
.flow{animation:flow 1.4s linear infinite}
@keyframes tw{0%,60%,100%{opacity:1}75%,90%{opacity:.1}}
.tw{animation:tw 5s ease-in-out infinite}
@keyframes zin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes zout{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:scale(1)}}
.enter{animation:zin .45s ease-out}
.enter.back{animation-name:zout}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:900px){main{flex-direction:column}#side{width:auto;height:45%;border-left:0;border-top:1px solid var(--line)}.live{display:none}#legend{display:none}}
</style>
</head>
<body>
<header>
  <h1>공장 물류 3D 현황</h1>
  <div class="search"><input id="q" placeholder="FOUP 검색  ( / 키 )" autocomplete="off" spellcheck="false"><button class="x" id="qx" title="검색 지우기">×</button><div id="sres" class="sres"></div></div>
  <div class="live"><i></i><span id="stamp"></span></div>
  <button id="btnLoad">데이터 불러오기</button>
  <input type="file" id="file" multiple accept=".csv,.json,.txt,.tsv" hidden>
  <div class="pop"><button id="btnTpl">양식 · 샘플 ▾</button>
    <div class="menu" id="menu">
      <p>현재 데이터를 엑셀에서 열 수 있는 표 파일로 받습니다. 같은 모양으로 채워서 다시 불러오면 됩니다.</p>
      <button data-tpl="foups">FOUP 표 (필수)</button>
      <button data-tpl="machines">Machine 표 (선택)</button>
      <button data-tpl="ports">Port 표 (선택)</button>
      <button id="btnSample">샘플 데이터로 되돌리기</button>
    </div>
  </div>
</header>
<nav id="crumb"></nav>
<main>
  <section id="stage">
    <svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"></div>
    <div id="hint"></div>
    <div class="zoom"><button data-z="1" title="확대">＋</button><button data-z="-1" title="축소">－</button><button data-z="0" title="처음 크기">⟲</button></div>
  </section>
  <aside id="side"></aside>
</main>
<div id="tip"></div><div id="toast"></div><div id="drop">파일을 여기에 놓으세요 (CSV · JSON)</div>
<script>
'use strict';
/* =========================================================
   공장 물류 3D 현황 — 파일 하나로 동작 (외부 라이브러리 없음)
   데이터: FOUP 표(필수) + Machine 표(선택) + Port 표(선택)
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const nat=(a,b)=>String(a).localeCompare(String(b),'ko',{numeric:true});
function floorKey(n){n=String(n);const m=/^B(\d+)/i.exec(n);if(m)return -(+m[1]);const d=parseFloat(n);return isNaN(d)?999:d}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const HL='#ffb020',MV='#22d3ee',FO='#ff9f43',STBC='#9b7bff',STKC='#c08a3a',RAIL='#3fb6ff',GRAYM='#5b6270';
const ST={run:['#52c41a','가동'],idle:['#ffc53d','대기'],down:['#ff4d4f','고장'],pm:['#3fb6ff','정비']};
const PTC={In:['#3ddc97','InPort'],Out:['#ff6b81','OutPort'],InOut:['#3fb6ff','InOut']};
const ACOL=['#a29bfe','#55efc4','#fdcb6e','#fab1a0','#74b9ff','#81ecec','#ffeaa7','#fd79a8'];
const TYPE_NM={proc:'공정 Machine',stk:'Stoker',stb:'천장 STB'};
const NOAREA='(Area 없음)',NOBAY='(Bay 없음)',NONE='(미지정)';

/* ---------------- 데이터 ---------------- */
let DB={foups:[],machines:[],ports:[],src:'샘플 데이터',time:new Date()};
let T=new Map(),MI=new Map(),FI=new Map(),WARN=[];

function normType(t,name){t=String(t||'').toLowerCase();if(/stk|stocker|stoker|스토커/.test(t))return'stk';if(/stb/.test(t))return'stb';if(/proc|machine|eqp|공정|장비|설비/.test(t))return'proc';const n=String(name||'').toUpperCase();if(/^STK/.test(n))return'stk';if(/^STB/.test(n))return'stb';return'proc'}
function normState(s){s=String(s||'').toLowerCase();if(/down|고장|err|alarm|fault|trouble/.test(s))return'down';if(/pm|정비|maint/.test(s))return'pm';if(/idle|대기|wait|stand/.test(s))return'idle';return'run'}
function normLog(v){if(v==null||String(v).trim()==='')return true;return!/^(n|no|false|0|x|불가|불가능|아니오|미사용)$/i.test(String(v).trim())}
function normPT(v){v=String(v||'').toLowerCase().replace(/\s/g,'');if(/inout|both|둘|양방|in\/out|io/.test(v))return'InOut';if(/^in|입/.test(v))return'In';if(/^out|출/.test(v))return'Out';return'InOut'}
const isEmptyFoup=f=>/빈|empty/i.test(f.status||'');

function newNode(name){return{name,kids:new Map(),moving:[]}}
function newBay(name,area){return{name,area,machines:[],moving:[],isBay:true}}
function child(map,name){name=name||NONE;if(!map.has(name))map.set(name,newNode(name));return map.get(name)}
function bayOf(r){const s=child(T,r.site),b=child(s.kids,r.bld),f=child(b.kids,r.floor),a=child(f.kids,r.area||NOAREA);const bn=r.bay||NOBAY;if(!a.kids.has(bn))a.kids.set(bn,newBay(bn,a.name));return a.kids.get(bn)}

function build(){
  T=new Map();MI=new Map();FI=new Map();WARN=[];
  const addM=r=>{
    const key=String(r.machine).trim();let m=MI.get(key);if(m)return m;
    m={name:key,site:r.site||NONE,bld:r.bld||NONE,floor:r.floor||NONE,area:r.area||NOAREA,bay:r.bay||NOBAY,type:normType(r.type,key),state:normState(r.state||r.status),log:normLog(r.log),ports:[],foups:[]};
    if(m.type!=='proc')m.log=true;
    MI.set(key,m);bayOf(m).machines.push(m);return m};
  DB.machines.forEach(r=>{if(r.machine&&String(r.machine).trim())addM(r)});
  let pmiss=0;
  DB.ports.forEach(r=>{const m=MI.get(String(r.machine||'').trim());if(!m){pmiss++;return}const pn=String(r.port||'').trim();if(pn&&!m.ports.find(p=>p.name===pn))m.ports.push({name:pn,type:normPT(r.ptype),state:r.state||r.status||''})});
  let dup=0;
  DB.foups.forEach(r=>{
    const id=String(r.foup||'').trim();if(!id)return;
    if(FI.has(id.toUpperCase())){dup++;return}
    const f={id,lot:r.lot||'',status:r.status||'',time:r.time||'',port:String(r.port||'').trim(),from:r.from||'',to:r.to||''};
    const mname=String(r.machine||'').trim();
    if(mname&&!/^moving$/i.test(mname)){const m=addM(r);f.m=m;m.foups.push(f)}
    else{
      f.moving=true;f.site=r.site||NONE;f.bld=r.bld||'';f.floor=r.floor||'';f.area=r.area||'';f.bay=r.bay||'';
      let n=child(T,f.site);
      if(f.bld){n=child(n.kids,f.bld);if(f.floor){n=child(n.kids,f.floor);if(f.area){n=child(n.kids,f.area);if(f.bay){if(!n.kids.has(f.bay))n.kids.set(f.bay,newBay(f.bay,n.name));n=n.kids.get(f.bay)}}}}
      n.moving.push(f)}
    FI.set(id.toUpperCase(),f)});
  MI.forEach(m=>{m.ports.sort((a,b)=>nat(a.name,b.name));m.foups.sort((a,b)=>nat(a.port||'~',b.port||'~')||nat(a.id,b.id))});
  T.forEach(agg);
  if(dup)WARN.push(`같은 FOUP 번호 ${dup}개는 처음 한 줄만 사용했습니다.`);
  if(pmiss)WARN.push(`Machine 표에 없는 Port ${pmiss}줄은 무시했습니다.`);
}
function agg(n){
  const c={all:0,proc:0,stk:0,stb:0,mov:n.moving.length,mach:0,down:0};
  if(n.isBay)n.machines.forEach(m=>{c[m.type]+=m.foups.length;c.mach++;if(m.state==='down'&&m.log)c.down++});
  else n.kids.forEach(k=>{const kc=agg(k);for(const key in c)c[key]+=kc[key]});
  c.all=c.proc+c.stk+c.stb+c.mov;n.c=c;return c}
function allMoving(n){let r=n.moving.slice();if(!n.isBay)n.kids.forEach(k=>r=r.concat(allMoving(k)));return r}
function allMachines(n){if(n.isBay)return n.machines;let r=[];n.kids.forEach(k=>r=r.concat(allMachines(k)));return r}
function pathOf(f){
  if(!f)return null;
  if(f.m){const m=f.m;return{site:m.site,bld:m.bld,floor:m.floor,area:m.area,bay:m.bay,mach:m.name}}
  return{site:f.site,bld:f.bld,floor:f.floor,area:f.area,bay:f.bay}}
function pathText(f){
  if(f.m){const m=f.m;return[m.site,m.bld,m.floor,m.area,m.bay,m.name].filter(v=>v&&v!==NOBAY&&v!==NOAREA&&v!==NONE).join(' › ')+(f.port?' › '+f.port:(m.type!=='proc'?' (안에 보관)':''))}
  return[f.site,f.bld,f.floor,f.area,f.bay].filter(v=>v&&v!==NONE).concat('Moving').join(' › ')}
const portOf=f=>f&&f.m&&f.port?f.m.ports.find(p=>p.name===f.port):null;

/* ---------------- 표 파일 읽기 ---------------- */
const ALIAS={site:['site','사이트'],bld:['building','bld','bldg','건물','동'],floor:['floor','층','fl'],area:['area','에어리어','구역'],bay:['bay','베이'],
  machine:['machine','machinename','machineid','eqp','eqpid','equipment','장비','설비','장비명'],foup:['foup','foupid','carrier','carrierid','캐리어'],
  port:['port','portid','machineport','포트'],lot:['lot','lotid','로트'],status:['status','foupstatus','상태'],time:['time','시간','시각','updatetime','eventtime'],
  from:['from','출발','출발지','source'],to:['to','도착','도착지','목적지','dest','destination'],type:['type','machinetype','종류','타입','유형'],
  state:['state','machinestate','eqpstate','장비상태','machine상태'],log:['logistics','물류','물류가능','물류여부'],ptype:['porttype','구분','portkind','방향','inout']};
const hn=h=>String(h).replace(/^﻿/,'').toLowerCase().replace(/[\s_\-().·]/g,'');
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/,1)[0]||'';
  const dl=[',','\t',';'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur==='')q=true;else if(c===dl){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''))}
function mapRows(rows){
  const H=rows[0].map(hn),idx={};
  for(const k in ALIAS){const i=H.findIndex(h=>ALIAS[k].includes(h));if(i>=0)idx[k]=i}
  return{keys:Object.keys(idx),rows:rows.slice(1).map(r=>{const o={};for(const k in idx)o[k]=String(r[idx[k]]==null?'':r[idx[k]]).trim();return o})}}
function classify(keys){if(keys.includes('foup'))return'foups';if(keys.includes('ptype')||(keys.includes('port')&&keys.includes('machine')&&!keys.includes('site')))return'ports';if(keys.includes('machine'))return'machines';return null}
async function readText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('euc-kr').decode(buf)}}
function objsToRows(arr){const keys=[...new Set(arr.flatMap(o=>o&&typeof o==='object'?Object.keys(o):[]))];return[keys,...arr.map(o=>keys.map(k=>o&&o[k]!=null?o[k]:''))]}
async function loadFiles(files){
  const got={foups:null,machines:null,ports:null},names=[],bad=[];let latest=0;
  for(const file of files){
    try{
      const txt=await readText(file);const sets=[];
      if(/\.json$/i.test(file.name)||/^\s*[\[{]/.test(txt)){const j=JSON.parse(txt);
        if(Array.isArray(j))sets.push(objsToRows(j));else for(const k in j)if(Array.isArray(j[k])&&j[k].length)sets.push(objsToRows(j[k]))}
      else sets.push(parseCSV(txt));
      let used=false;
      sets.forEach(rows=>{if(!rows||rows.length<2)return;const m=mapRows(rows),kind=classify(m.keys);if(!kind)return;
        if(kind==='machines')m.rows.forEach(r=>{if(!r.state&&r.status)r.state=r.status});
        got[kind]=(got[kind]||[]).concat(m.rows);used=true});
      if(used){names.push(file.name);latest=Math.max(latest,file.lastModified||0)}else bad.push(file.name)
    }catch(e){bad.push(file.name)}
  }
  if(!names.length){toast('읽을 수 있는 표가 없습니다. 첫 줄에 FOUP · Machine 같은 제목 칸이 있어야 합니다.'+(bad.length?' ('+bad.join(', ')+')':''));return}
  if(got.foups)DB={foups:got.foups,machines:got.machines||[],ports:got.ports||[]};
  else{if(got.machines)DB.machines=got.machines;if(got.ports)DB.ports=got.ports}

}

    else{const na=ri(3,4),start=ri(0,5);
      for(let ai=0;ai<na;ai++){const[code,anm]=AR[(start+ai)%AR.length],area=`${anm}(${code})`;
        for(let bi=1,nb=ri(2,3);bi<=nb;bi++){const bay=`${code}-B${bt}${fl}${bi}`;

            if(!log)continue;const npt=ri(2,4);

            for(let j=0;j<npt;j++){const port='LP'+(j+1),has=R()<0.55;P.push({machine:name,port,ptype:types[j],state:has?'사용 중':'비어 있음'});
              if(has){const s=pick(['대기','공정 중','공정 중','반출 대기','빈 FOUP']);F.push({site,bld,floor,area,bay,machine:name,foup:nf(),port,lot:s==='빈 FOUP'?'':lot(),status:s,time:tm()})}}}
          if(R()<0.6){const name=`STK-${bt}${fl}${ai}${bi}`;M.push({site,bld,floor,area,bay,machine:name,type:'Stoker',state:pick(['run','run','idle']),log:'Y'});
            P.push({machine:name,port:'IN',ptype:'In',state:'정상'},{machine:name,port:'OUT',ptype:'Out',state:'대기'});
            for(let j=ri(10,40);j>0;j--)F.push({site,bld,floor,area,bay,machine:name,foup:nf(),lot:lot(),status:'보관',time:tm()});onFloor.push(name)}
          for(let k=1,ns=ri(2,3);k<=ns;k++){const name=`STB-${bt}${fl}${ai}${bi}${k}`;M.push({site,bld,floor,area,bay,machine:name,type:'STB',state:'run',log:'Y'});

/* ---------------- 입체 그리기 도구 ---------------- */
const C30=Math.cos(Math.PI/6);
function mkO(s,ox,oy,fit){return{s,ox,oy,bb:fit?[1e9,1e9,-1e9,-1e9]:null,items:[],top:[],post:[],cur:null,navs:[]}}
function P(o,x,y,z){const X=o.ox+(x-y)*C30*o.s,Y=o.oy+(x+y)*0.5*o.s-z*o.s,b=o.bb;if(b){if(X<b[0])b[0]=X;if(X>b[2])b[2]=X;if(Y<b[1])b[1]=Y;if(Y>b[3])b[3]=Y}return[Math.round(X*10)/10,Math.round(Y*10)/10]}
function nav(o,to,tip){o.navs.push({to,tip});return o.navs.length-1}
const wrap=(o,s)=>o.cur!=null?`<g data-nav="${o.cur}">${s}</g>`:s;
function push(o,k,s,top){(top?o.top:o.items).push({k,s:wrap(o,s)})}
function poly(p,f,st,sw){return`<polygon points="${p.map(a=>a.join(',')).join(' ')}" fill="${f}" stroke="${st||'#00000055'}" stroke-width="${sw==null?0.8:sw}" stroke-linejoin="round"/>`}
function shade(h,f){const n=parseInt(h.slice(1,7),16);return`rgb(${[n>>16,n>>8&255,n&255].map(v=>Math.min(255,Math.round(v*f)))})`}
function box(o,x,y,z,w,d,h,col,e={}){
  const p=(a,b,c)=>P(o,a,b,c);
  const Tp=[p(x,y,z+h),p(x+w,y,z+h),p(x+w,y+d,z+h),p(x,y+d,z+h)],L=[p(x,y+d,z),p(x+w,y+d,z),p(x+w,y+d,z+h),p(x,y+d,z+h)],R=[p(x+w,y,z),p(x+w,y+d,z),p(x+w,y+d,z+h),p(x+w,y,z+h)];
  let s=poly(L,shade(col,.74),e.st,e.sw)+poly(R,shade(col,.56),e.st,e.sw)+poly(Tp,shade(col,1.08),e.st,e.sw);
  if(e.cls)s=`<g class="${e.cls}" style="animation-delay:-${(Math.random()*3).toFixed(2)}s">${s}</g>`;
  push(o,e.k!=null?e.k:(x+w/2+y+d/2+z*0.01),s,e.top)}
function cyl(o,cx,cy,z,r,h,col,e={}){
  const N=18,pt=(t,zz)=>P(o,cx+r*Math.cos(t),cy+r*Math.sin(t),zz),A=[];for(let i=0;i<N;i++)A.push(i*2*Math.PI/N);
  const fr=[];for(let i=0;i<=12;i++){const t=-Math.PI/4+i*Math.PI/12;fr.push(t)}
  const side=fr.map(t=>pt(t,z)).concat(fr.slice().reverse().map(t=>pt(t,z+h)));
  let s=poly(side,shade(col,.68),e.st,e.sw)+poly(A.map(t=>pt(t,z+h)),shade(col,1.05),e.st,e.sw);
  if(e.ring)s+=poly(A.map(t=>P(o,cx+r*0.7*Math.cos(t),cy+r*0.7*Math.sin(t),z+h)),'#1f2a3a','none',0);
  push(o,e.k!=null?e.k:cx+cy+z*0.01,s,e.top)}
function faceL(o,x,y,z,w,d,a0,a1,b0,b1,f,k,st){push(o,k,poly([P(o,x+a0,y+d,z+b0),P(o,x+a1,y+d,z+b0),P(o,x+a1,y+d,z+b1),P(o,x+a0,y+d,z+b1)],f,st||'none',st?0.8:0))}
function faceR(o,x,y,z,w,d,a0,a1,b0,b1,f,k,st){push(o,k,poly([P(o,x+w,y+a0,z+b0),P(o,x+w,y+a1,z+b0),P(o,x+w,y+a1,z+b1),P(o,x+w,y+a0,z+b1)],f,st||'none',st?0.8:0))}
function seg(o,p,q,st,sw,k,top,dash){const a=P(o,...p),b=P(o,...q);push(o,k,`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${st}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:''}/>`,top)}
function flat(o,x,y,z,w,d,f,st,sw,k,dash){let s=poly([P(o,x,y,z),P(o,x+w,y,z),P(o,x+w,y+d,z),P(o,x,y+d,z)],f,st,sw);if(dash)s=s.replace('/>',` stroke-dasharray="${dash}"/>`);push(o,k==null?-50:k,s)}
function line(o,pts,st,sw){push(o,0,`<polyline points="${pts.map(p=>P(o,...p)).join(' ')}" fill="none" stroke="${st}" stroke-width="${sw}" stroke-linecap="round"/>`,true)}
function flow(o,pts,c){push(o,1,`<polyline class="flow" points="${pts.map(p=>P(o,...p)).join(' ')}" fill="none" stroke="${c||'#ffffff70'}" stroke-width="1.5" stroke-dasharray="3 17" stroke-linecap="round"/>`,true)}
function tag(o,x,y,z,t,e={}){
  const[px,py]=P(o,x,y,z),fs=e.fs||12,dy=e.dy==null?-26:e.dy;let w=14;for(const ch of String(t))w+=ch.charCodeAt(0)>255?fs:fs*0.62;

  `<rect x="${(px-w/2).toFixed(1)}" y="${py+dy-fs/2-5}" width="${w.toFixed(1)}" height="${fs+10}" rx="5" fill="${bg}" stroke="${bd}"/><text x="${px}" y="${py+dy+fs*0.36}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="${e.bold?700:400}">${esc(t)}</text>`))}
function txt(o,x,y,z,t,fs,c,bold){const[px,py]=P(o,x,y,z);o.post.push(wrap(o,`<text x="${px}" y="${py}" font-size="${fs}" fill="${c}" text-anchor="middle" font-weight="${bold?700:400}" paint-order="stroke" stroke="#0b1422" stroke-width="3" stroke-linejoin="round">${esc(t)}</text>`))}
function ring(o,x,y,z,r){const[cx,cy]=P(o,x,y,z);o.post.push(`<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r/2}" fill="none" stroke="${HL}" stroke-width="2.5"><animate attributeName="rx" values="${r};${r*2.6}" dur="1.8s" repeatCount="indefinite"/><animate attributeName="ry" values="${r/2};${r*1.3}" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></ellipse><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r/2}" fill="none" stroke="${HL}" stroke-width="2"/>`)}
function sub(o){return mkO(o.s,0,0)}
const flush=t=>t.items.map(i=>i.s).join('');
function mover(o,pts,html,dur,delay,bf){const path='M'+pts.map(q=>P(o,...q).join(',')).join(' L');
  o.top.push({k:999,s:`<g>${html}<animateMotion dur="${dur}s" begin="-${delay}s" repeatCount="indefinite" path="${path}"${bf?' keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"':''}/></g>`})}

/* 건물: 층 띠·창문·출입구·옥상 설비 */
function bldg(o,x,y,w,d,h,fl,col,e={}){
  const k=x+w/2+y+d/2;

    if(f>0){seg(o,[x,y+d,f*fh],[x+w,y+d,f*fh],'#ffffff35',1,k+0.001);seg(o,[x+w,y+d,f*fh],[x+w,y,f*fh],'#ffffff35',1,k+0.001)}
    for(let a=0.25;a<w-0.4;a+=0.6)faceL(o,x,y,0,w,d,a,a+0.38,b0,b1,'#bfe3ff4d',k+0.001);
    for(let a=0.25;a<d-0.4;a+=0.6)faceR(o,x,y,0,w,d,a,a+0.38,b0,b1,'#9fd0ff38',k+0.001)}
  if(e.band){const[z0,z1]=e.band;faceL(o,x,y,0,w,d,0,w,z0,z1,HL+'77',k+0.002,HL);faceR(o,x,y,0,w,d,0,d,z0,z1,HL+'55',k+0.002,HL)}

  box(o,x,y,h,w,0.12,0.25,col,{k:k+0.004});box(o,x,y,h,0.12,d,0.25,col,{k:k+0.004});
  faceL(o,x,y,0,w,d,w*0.08,w*0.46,h-Math.min(0.5,fh*0.25)-0.12,h-0.12,'#0b1422',k+0.003,'#3fb6ff');
  faceL(o,x,y,0,w,d,w*0.11,w*0.43,h-Math.min(0.5,fh*0.25)-0.05,h-0.19,'#3fb6ff55',k+0.003);

    .forEach(([rx,ry,rw,rd,rh,c],i)=>{if(rx+rw<w&&ry+rd<d)box(o,x+rx,y+ry,h,rw,rd,rh,c||'#7b8ea8',{k:k+0.01+i*0.001})})}

/* 공정 Machine: 패널선·화면·통풍구·배기덕트·상태등 */

/* Stoker: 투명 유리 + 안쪽 선반 + 보관 FOUP */
function stk(o,x,y,z,w,d,h,lv,e={}){

let cur={lvl:'site',site:null},NAVS=[],cam={k:1,x:0,y:0},goingBack=false;

const firstSite=()=>[...T.keys()].sort(nat)[0];
function nodeOf(c){
  const s=T.get(c.site);if(!s||c.lvl==='site')return s;
  const b=s.kids.get(c.bld);if(!b||c.lvl==='bld')return b;
  const f=b.kids.get(c.floor);if(!f||c.lvl==='floor')return f;
  const a=f.kids.get(c.area),y=a&&a.kids.get(c.bay);if(c.lvl==='bay')return y&&y.isBay?y:null;
  const m=MI.get(c.mach);return m&&y&&y.machines.includes(m)?m:null}
function go(to,back){goingBack=!!back||LV.indexOf(to.lvl)<LV.indexOf(cur.lvl);cur=to;resetCam();render()}
function up(){const i=LV.indexOf(cur.lvl);if(i<=0)return;const t=Object.assign({},cur,{lvl:LV[i-1]});go(t,true)}
function goFoup(f){if(!f)return;HLF=f;const p=pathOf(f);
  if(f.m)go(Object.assign({lvl:'mach'},p));
  else if(p.bay&&p.area)go(Object.assign({lvl:'bay'},p));
  else if(p.floor)go({lvl:'floor',site:p.site,bld:p.bld,floor:p.floor});

const svg=$('#sv'),stage=$('#stage'),side=$('#side');

const qEl=$('#q'),sres=$('#sres');let sIdx=0,sList=[];

function zoomAt(px,py,f){const nk=Math.min(8,Math.max(0.4,cam.k*f));cam.x=px-(px-cam.x)*nk/cam.k;cam.y=py-(py-cam.y)*nk/cam.k;cam.k=nk;applyCam()}

  if(e.key==='/'){e.preventDefault();qEl.focus()}else if(e.key==='Escape')up()});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});

/* ---------------- 파일 불러오기 ---------------- */
$('#btnLoad').onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files.length)loadFiles([...e.target.files]);e.target.value=''};
$('#btnTpl').onclick=e=>{e.stopPropagation();const m=$('#menu');m.style.display=m.style.display==='block'?'none':'block'};
$('#menu').addEventListener('click',e=>{const k=e.target.getAttribute('data-tpl');if(k)download(k)});
$('#btnSample').onclick=()=>{DB=Object.assign(genSample(),{src:'샘플 데이터',time:new Date()});HLF=null;qEl.value='';build();cur={lvl:'site',site:firstSite()};resetCam();render();toast('샘플 데이터로 되돌렸습니다.')};
let dc=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').style.display='flex'});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#drop').style.display='none'}});
window.addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').style.display='none';const fs=[...(e.dataTransfer.files||[])];if(fs.length)loadFiles(fs)});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',5000)}

/* ---------------- 시작 ---------------- */
DB=Object.assign(genSample(),{src:'샘플 데이터',time:new Date()});
build();cur={lvl:'site',site:firstSite()};
try{const h=JSON.parse(decodeURIComponent(location.hash.slice(1)||'null'));if(h&&h.c)cur=h.c;if(h&&h.f){const f=FI.get(String(h.f).toUpperCase());if(f){HLF=f;qEl.value=f.id;$('#qx').style.display='block'}}}catch(e){}
render();
</script>
